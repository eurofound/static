<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Housing indicators by country, region and population group</title>
  <script>
    // The languages this embed is translated into, English first. The embed script announces them.
    var EF_LANGUAGES = ['en'];

    // Before first paint: the theme (?theme= from the site, else the OS), the language (?lang= if
    // the embed has it, else English), and whether we're framed.
    (function () {
      var root = document.documentElement;
      var params = new URLSearchParams(location.search);
      var t = params.get('theme');
      if (t !== 'light' && t !== 'dark') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.dataset.theme = t;
      var lang = params.get('lang');
      root.lang = EF_LANGUAGES.indexOf(lang) >= 0 ? lang : 'en';
      if (window.parent !== window) root.dataset.embedded = '';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link rel="stylesheet" href="https://www.eurofound.europa.eu/api/embed/v1/theme.css" />

  <script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/highcharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/highcharts-more.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/modules/map.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/modules/exporting.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highcharts@12.1.2/modules/accessibility.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <link rel="stylesheet" href="erm-palette.css?v=20261124" />
  <link rel="stylesheet" href="housing-embed.css?v=20261124" />
</head>
<body class="ef-embed">

<div class="dashboard">
  <div class="ef-tabs" role="tablist" aria-label="Views">
    <button type="button" class="ef-tab" role="tab" id="tab-bar" data-tab="bar" aria-selected="true" aria-controls="panel" tabindex="0">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16v2H4zm2-14h3v12H6zm5-4h3v16h-3zm5 7h3v9h-3z"/></svg><span>Bar chart</span>
    </button>
    <button type="button" class="ef-tab" role="tab" id="tab-map" data-tab="map" aria-selected="false" aria-controls="panel" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg><span>Map</span>
    </button>
    <button type="button" class="ef-tab" role="tab" id="tab-radar" data-tab="radar" aria-selected="false" aria-controls="panel" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l4 15h12l4-15L12 2zm0 2.8l6.8 3.4-1.6 6h-10.4l-1.6-6L12 4.8zM12 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"/></svg><span>Radar</span>
    </button>
    <button type="button" class="ef-tab" role="tab" id="tab-country" data-tab="country" aria-selected="false" aria-controls="panel" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><span>Country overview</span>
    </button>
    <button type="button" class="ef-tab" role="tab" id="tab-radar2" data-tab="radar2" aria-selected="false" aria-controls="panel" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l4 15h12l4-15L12 2zm0 2.8l6.8 3.4-1.6 6h-10.4l-1.6-6L12 4.8z"/></svg><span>Radar comparison</span>
    </button>
  </div>

  <div id="panel" class="panel" role="tabpanel" aria-labelledby="tab-bar">
    <div class="controls">
      <div id="topic-field" role="group" aria-labelledby="topic-label">
        <span class="ef-label" id="topic-label">Topic</span>
        <div id="topic-container" class="chip-row"></div>
      </div>

      <div class="filters">
        <div id="indicator-field">
          <div class="indicator-heading"><label class="ef-label" for="indicator-sel">Indicator</label><span id="indicator-position" aria-live="polite"></span></div>
          <div class="indicator-navigation">
            <button type="button" id="indicator-prev" class="indicator-step" aria-label="Previous indicator">‹</button>
            <select id="indicator-sel" class="ef-select"></select>
            <button type="button" id="indicator-next" class="indicator-step" aria-label="Next indicator">›</button>
          </div>
        </div>

        <div id="geo-field" role="group" aria-labelledby="geo-label" hidden>
          <span class="ef-label" id="geo-label">Geography</span>
          <div class="chip-row">
            <button type="button" class="ef-chip" id="geo-national" aria-pressed="true">Countries</button>
            <button type="button" class="ef-chip" id="geo-nuts" aria-pressed="false">NUTS regions</button>
          </div>
        </div>

        <div id="breakdown-field">
          <label class="ef-label" for="category-sel">Breakdown</label>
          <select id="category-sel" class="ef-select"></select>
        </div>

        <div id="cat-field" hidden>
          <label class="ef-label" id="cat-label" for="cat-toggle">Categories (max 6)</label>
          <div class="dropdown-wrapper">
            <button type="button" id="cat-toggle" class="ef-select" aria-expanded="false" aria-controls="cat-list" aria-labelledby="cat-label cat-value"><span id="cat-value">Select…</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></button>
            <div id="cat-list" class="checkbox-list ef-popover" hidden></div>
          </div>
        </div>

        <div id="sort-field"><label class="ef-label" for="sort-sel">Sort</label><select id="sort-sel" class="ef-select"><option value="desc">Highest first</option><option value="alpha">Country A–Z</option></select></div>
        <div id="bar-country-field">
          <label class="ef-label" id="bar-country-label" for="bar-country-toggle">Countries</label>
          <div class="dropdown-wrapper">
            <button type="button" id="bar-country-toggle" class="ef-select" aria-expanded="false" aria-controls="bar-country-list" aria-labelledby="bar-country-label bar-country-value"><span id="bar-country-value">All countries</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></button>
            <div id="bar-country-list" class="checkbox-list ef-popover" hidden></div>
          </div>
        </div>

        <div id="radar-country-field" hidden>
          <label class="ef-label" id="radar-country-label" for="radar-country-toggle">Countries (max 2)</label>
          <div class="dropdown-wrapper">
            <button type="button" id="radar-country-toggle" class="ef-select" aria-expanded="false" aria-controls="radar-country-list" aria-labelledby="radar-country-label radar-country-value"><span id="radar-country-value">Select…</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></button>
            <div id="radar-country-list" class="checkbox-list ef-popover" hidden></div>
          </div>
        </div>

        <div id="cp-country-field" hidden>
          <label class="ef-label" for="cp-country-toggle">Country</label>
          <select id="cp-country-sel" hidden tabindex="-1" aria-hidden="true"></select>
          <div class="dropdown-wrapper"><button type="button" id="cp-country-toggle" class="ef-select" aria-expanded="false" aria-controls="cp-country-list" aria-label="Country"><span id="cp-country-value"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></button><div id="cp-country-list" class="checkbox-list ef-popover" hidden></div></div>
        </div>

        <div id="r2-country-field" hidden>
          <label class="ef-label" id="r2-country-label" for="r2-country-toggle">Countries (max 5)</label>
          <div class="dropdown-wrapper">
            <button type="button" id="r2-country-toggle" class="ef-select" aria-expanded="false" aria-controls="r2-country-list" aria-labelledby="r2-country-label r2-country-value"><span id="r2-country-value">Select…</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></button>
            <div id="r2-country-list" class="checkbox-list ef-popover" hidden></div>
          </div>
        </div>

        <div id="global-ind-field" hidden>
          <label class="ef-label" id="global-ind-label" for="global-ind-toggle">Indicators (max 10)</label>
          <div class="dropdown-wrapper">
            <button type="button" id="global-ind-toggle" class="ef-select" aria-expanded="false" aria-controls="global-ind-list" aria-labelledby="global-ind-label global-ind-value"><span id="global-ind-value">Select…</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg></button>
            <div id="global-ind-list" class="checkbox-list ef-popover wide" hidden></div>
          </div>
        </div>

        <div id="cp-cat-field" hidden>
          <label class="ef-label" for="cp-cat-sel">Population group</label>
          <select id="cp-cat-sel" class="ef-select"></select>
        </div>
      </div>
    </div>

    <div id="low-data" class="ef-notice ef-notice--warning" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      <span>Some values are not shown because they are based on fewer than 50 observations.</span>
    </div>

    <div id="chart-main">
      <div id="status" class="viz-status" role="status"></div>
      <div id="viz" class="viz"></div>
    </div>

    <div id="notes" class="notes ef-text-muted" hidden></div>
  </div>
</div>




<script src="housing-interactions.js?v=20261124"></script>
<script src="housing-embed.js?v=20261124"></script>
</body>
</html>
