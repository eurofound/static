<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EU Working Time – SVG + Highcharts-style Exports</title>
<style>
  :root{
    --blue:#0d5675;
    --green:#3aa654;
    --line15:#1f7fbf;
    --line27:#3bb3ff;
    --line13:#3aa654;
    --axis:#7a7a7a;
    --grid:#e6e6e6;
  }
  body{margin:0;background:#f5f7f8;font-family:Segoe UI, Roboto, Helvetica, Arial, sans-serif}
  /* removed border & shadow to avoid any visible frame */
  .wrap{width:1020px;max-width:100%;margin:18px auto;background:#fff}
  .panel{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee}
  .panel label{font:600 14px/1.2 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#333}
  .panel input[type="text"]{flex:1;max-width:720px;padding:8px 10px;border:1px solid #d6d6d6;border-radius:8px;font:14px/1.2 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  svg{display:block;width:100%;height:auto;outline:none}
  .label{font-size:15px;fill:#4a4a4a}
  .value-in{font-size:14px;fill:#ffffff;font-weight:700}
  .axis text{font-size:12px;fill:var(--axis)}
  .axis-title{font-size:20px;fill:#6a6a6a}
  .grid{stroke:var(--grid);stroke-width:1}
  .tick{stroke:#e2e2e2;stroke-width:1}
  .vline15{stroke:var(--line15);stroke-width:3;stroke-dasharray:6 6}
  .vline27{stroke:var(--line27);stroke-width:3;stroke-dasharray:6 6}
  .vline13{stroke:var(--line13);stroke-width:3;stroke-dasharray:6 6}
  .note15{fill:var(--line15)}
  .note27{fill:var(--line27)}
  .note13{fill:var(--line13)}
  .bar-eu14{fill:var(--blue)}
  .bar-eu13{fill:var(--green)}
  .bar-nor{fill:#cfcfcf}
  .actions{display:none;}  /* hide export buttons */
</style>
</head>
<body>
<div class="wrap">
  <!-- Title input (used for filenames and export overlay title) -->
  <div class="panel">
    <label for="chartTitle">Chart title</label>
    <input id="chartTitle" type="text" placeholder="Enter chart title…" value="Average usual weekly working hours in the EU">
  </div>

  <!-- Chart (no on-page title node; export will inject one dynamically) -->
  <svg id="chart" viewBox="0 0 1020 760" role="img" aria-label="Average usual weekly working hours, horizontal bars with EU reference lines">
    <!-- removed outer white rect to eliminate any hairline frame; export will still be white via canvas fill -->

    <g class="axis">
      <line x1="250" y1="110" x2="250" y2="640" class="grid"/>
      <text x="250" y="662" text-anchor="middle">30</text>
      <line x1="320" y1="110" x2="320" y2="640" class="tick"/><text x="320" y="662" text-anchor="middle">31</text>
      <line x1="390" y1="110" x2="390" y2="640" class="tick"/><text x="390" y="662" text-anchor="middle">32</text>
      <line x1="460" y1="110" x2="460" y2="640" class="tick"/><text x="460" y="662" text-anchor="middle">33</text>
      <line x1="530" y1="110" x2="530" y2="640" class="tick"/><text x="530" y="662" text-anchor="middle">34</text>
      <line x1="600" y1="110" x2="600" y2="640" class="tick"/><text x="600" y="662" text-anchor="middle">35</text>
      <line x1="670" y1="110" x2="670" y2="640" class="tick"/><text x="670" y="662" text-anchor="middle">36</text>
      <line x1="740" y1="110" x2="740" y2="640" class="tick"/><text x="740" y="662" text-anchor="middle">37</text>
      <line x1="810" y1="110" x2="810" y2="640" class="tick"/><text x="810" y="662" text-anchor="middle">38</text>
      <line x1="880" y1="110" x2="880" y2="640" class="tick"/><text x="880" y="662" text-anchor="middle">39</text>
      <line x1="950" y1="110" x2="950" y2="640" class="grid"/>
      <text x="950" y="662" text-anchor="middle">40</text>
      <text x="600" y="698" text-anchor="middle" class="axis-title">Hours per week</text>
    </g>

    <!-- Bars -->
    <text class="label" x="240" y="127" text-anchor="end">Germany</text>
    <rect class="bar-eu14" x="250" y="113" width="371.0" height="28"></rect>
    <text class="value-in" x="611" y="132" text-anchor="end">35.3</text>

    <text class="label" x="240" y="169" text-anchor="end">France</text>
    <rect class="bar-eu14" x="250" y="155" width="420" height="28"></rect>
    <text class="value-in" x="660" y="174" text-anchor="end">36.0</text>

    <text class="label" x="240" y="211" text-anchor="end">Denmark</text>
    <rect class="bar-eu14" x="250" y="197" width="490" height="28"></rect>
    <text class="value-in" x="730" y="216" text-anchor="end">37.0</text>

    <text class="label" x="240" y="253" text-anchor="end">Norway</text>
    <rect class="bar-nor" x="250" y="239" width="525" height="28"></rect>
    <text class="value-in" x="765" y="258" text-anchor="end">37.5</text>

    <text class="label" x="240" y="295" text-anchor="end">Finland</text>
    <rect class="bar-eu14" x="250" y="281" width="525" height="28"></rect>
    <text class="value-in" x="765" y="300" text-anchor="end">37.5</text>

    <text class="label" x="240" y="337" text-anchor="end">Czech Republic</text>
    <rect class="bar-eu13" x="250" y="323" width="539" height="28"></rect>
    <text class="value-in" x="779" y="342" text-anchor="end">37.7</text>

    <text class="label" x="240" y="379" text-anchor="end">Belgium</text>
    <rect class="bar-eu14" x="250" y="365" width="546" height="28"></rect>
    <text class="value-in" x="786" y="384" text-anchor="end">37.8</text>

    <text class="label" x="240" y="421" text-anchor="end">Netherlands</text>
    <rect class="bar-eu14" x="250" y="407" width="560" height="28"></rect>
    <text class="value-in" x="800" y="426" text-anchor="end">38.0</text>

    <text class="label" x="240" y="463" text-anchor="end">Cyprus</text>
    <rect class="bar-eu13" x="250" y="449" width="560" height="28"></rect>
    <text class="value-in" x="800" y="468" text-anchor="end">38.0</text>

    <text class="label" x="240" y="505" text-anchor="end">Spain</text>
    <rect class="bar-eu14" x="250" y="491" width="567" height="28"></rect>
    <text class="value-in" x="807" y="510" text-anchor="end">38.1</text>

    <text class="label" x="240" y="547" text-anchor="end">Austria</text>
    <rect class="bar-eu14" x="250" y="533" width="595" height="28"></rect>
    <text class="value-in" x="835" y="552" text-anchor="end">38.5</text>

    <text class="label" x="240" y="589" text-anchor="end">Greece, Italy, Luxembourg, Portugal, Sweden</text>
    <rect class="bar-eu14" x="250" y="575" width="700" height="28"></rect>
    <text class="value-in" x="940" y="594" text-anchor="end">40.0</text>

    <text class="label" x="240" y="631" text-anchor="end">Croatia, Malta, Slovakia, Slovenia</text>
    <rect class="bar-eu13" x="250" y="617" width="700" height="28"></rect>
    <text class="value-in" x="940" y="636" text-anchor="end">40.0</text>

    <!-- dashed reference lines OVER bars -->
    <line x1="775" y1="110" x2="775" y2="640" class="vline15"/>
    <line x1="817" y1="110" x2="817" y2="640" class="vline27"/>
    <line x1="929" y1="110" x2="929" y2="640" class="vline13"/>

    <!-- line labels -->
    <g font-size="13">
      <text x="775" y="40" text-anchor="middle" class="note15">EU15, 37.5 hours</text>
      <text x="817" y="62" text-anchor="middle" class="note27">EU27, 38.1 hours</text>
      <text x="929" y="84" text-anchor="middle" class="note13">EU13, 39.7 hours</text>
    </g>
  </svg>

  <!-- Actions kept in DOM but hidden (functionality intact) -->
  <div class="actions">
    <button class="btn" id="dlCSV">Download data (CSV)</button>
    <button class="btn" id="dlPNG">Download image (PNG)</button>
  </div>
</div>

<script>
/* ====== DATA for CSV ====== */
const CSV_ROWS = [
  ["Country or group","Hours per week"],
  ["Germany","35.3"],
  ["France","36.0"],
  ["Denmark","37.0"],
  ["Norway","37.5"],
  ["Finland","37.5"],
  ["Czech Republic","37.7"],
  ["Belgium","37.8"],
  ["Netherlands","38.0"],
  ["Cyprus","38.0"],
  ["Spain","38.1"],
  ["Austria","38.5"],
  ["Greece, Italy, Luxembourg, Portugal, Sweden","40.0"],
  ["Croatia, Malta, Slovakia, Slovenia","40.0"],
  ["EU15 average","37.5"],
  ["EU27 average","38.1"],
  ["EU13 average","39.7"]
];

/* ====== Title plumbing ====== */
const titleInput = document.getElementById('chartTitle');
function getChartTitle(){
  return (titleInput?.value || '').trim();
}

/* ====== FILENAME helper (uses first 20 chars of title) ====== */
function safeFile(s){
  return String(s)
    .replace(/[<>:"/\\|?*\u0000-\u001F]/g,'-')
    .replace(/\s+/g,' ')
    .trim();
}
function exportName(kind){
  const base = getChartTitle() || 'Working time';
  const first20 = base.slice(0,20);
  return safeFile(`${first20}_${kind}`);
}

/* ====== Highcharts-like shim ====== */
window.chart = {
  getCSV(){
    const csv = CSV_ROWS.map(row =>
      row.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v).join(',')
    ).join('\n');
    return csv;
  },
  exportChartLocal({type='image/png', filename='chart'} = {}){
    const srcSvg = document.getElementById('chart');
    if (!srcSvg) return;

    // Clone SVG
    const svgClone = srcSvg.cloneNode(true);

    // Inject styles (and ensure any export-only rules take effect)
    const cssText = Array.from(document.querySelectorAll('style'))
      .map(s => s.textContent).join('\n');
    const style = document.createElement('style');
    style.textContent = cssText + '\n.export-only{display:block !important}';
    svgClone.appendChild(style); // append last so it wins the cascade

    // --- Inject a title node (export only), regardless of what's on the page ---
    const titleText = getChartTitle();
    if (titleText){
      const NS = 'http://www.w3.org/2000/svg';
      const t = document.createElementNS(NS,'text');
      t.setAttribute('x','510');
      t.setAttribute('y','44');
      t.setAttribute('text-anchor','middle');
      t.setAttribute('class','export-only');
      t.setAttribute('style','font-size:22px;font-weight:700;fill:#2e2e2e');
      t.textContent = titleText;
      // Place as the first visual element so it's on top but before axes if needed
      svgClone.insertBefore(t, svgClone.firstChild);
    }

    // Serialize and paint onto a white canvas
    const serializer = new XMLSerializer();
    const svgStr = serializer.serializeToString(svgClone);

    const vb = srcSvg.viewBox.baseVal;
    const canvas = document.createElement('canvas');
    canvas.width = vb.width; canvas.height = vb.height;

    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const img = new Image();
    img.onload = function(){
      ctx.drawImage(img,0,0);
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (filename || 'chart') + (type === 'image/png' ? '.png' : '');
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },0);
      });
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  }
};

/* ====== Hidden buttons still work if triggered manually ====== */
const btnCSV = document.getElementById('dlCSV');
const btnPNG = document.getElementById('dlPNG');

function doCSVDownload(){
  const csv = chart.getCSV();
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = exportName('data') + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function doPNGDownload(){
  chart.exportChartLocal({ type:'image/png', filename: exportName('img') });
}

if (btnCSV) btnCSV.onclick = doCSVDownload;
if (btnPNG) btnPNG.onclick = doPNGDownload;

/* ====== External postMessage hooks (robust to different payload shapes) ====== */
window.triggerExportCSV = doCSVDownload; // optional same-origin helper
window.triggerExportPNG = doPNGDownload; // optional same-origin helper

window.addEventListener('message', (event) => {
  const d = event.data;

  function extractCmd(x){
    if (!x) return null;
    if (typeof x === 'string') return x;
    if (typeof x === 'object'){
      return x.type || x.action || x.cmd || x.command || x.event || x.name ||
             (x.data && (x.data.type || x.data.action || x.data.cmd || x.data.command)) ||
             null;
    }
    return null;
  }

  let cmd = extractCmd(d);
  if (!cmd) return;
  cmd = String(cmd).toLowerCase();

  if (cmd === 'download-png' || cmd === 'png' || cmd === 'image' || cmd === 'export-png'){
    doPNGDownload();
  } else if (cmd === 'download-csv' || cmd === 'csv' || cmd === 'data' || cmd === 'export-csv'){
    doCSVDownload();
  }
});
</script>
</body>
</html>
