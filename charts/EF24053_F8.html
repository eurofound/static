<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Public administration – SVG export</title>
<style>
  :root{
    --blue:#0d5675;
    --green:#3aa654;
    --line14:#1f7fbf;
    --line27:#3bb3ff;
    --line13:#3aa654;
    --axis:#7a7a7a;
    --grid:#e6e6e6;
  }
  html,body{height:100%}
  body{margin:0;background:#ffffff;font-family:Segoe UI, Roboto, "Roboto Fallback", Helvetica, Arial, sans-serif}
  .wrap{width:1020px;max-width:100%;margin:0 auto;background:transparent}
  svg{display:block;width:100%;height:auto;outline:none}

  .label{font-size:15px;fill:#4a4a4a}
  .value-in{font-size:14px;fill:#ffffff;font-weight:700}
  .axis text{font-size:12px;fill:var(--axis)}
  .axis-title{font-size:20px;fill:#6a6a6a}
  .grid{stroke:var(--grid);stroke-width:1}
  .tick{stroke:#e2e2e2;stroke-width:1}
  .vline14{stroke:var(--line14);stroke-width:3;stroke-dasharray:6 6}
  .vline27{stroke:var(--line27);stroke-width:3;stroke-dasharray:6 6}
  .vline13{stroke:var(--line13);stroke-width:3;stroke-dasharray:6 6}
  .note14{fill:var(--line14)}
  .note27{fill:var(--line27)}
  .note13{fill:var(--line13)}
  .bar-eu14{fill:var(--blue)}
  .bar-eu13{fill:var(--green)}
  .bar-nor{fill:#cfcfcf}
  .actions{display:none}
</style>
</head>
<body>
<div class="wrap">
  <!-- Chart only (no visible title node) -->
  <svg id="chart" viewBox="0 0 1020 760" role="img" aria-label="Collectively agreed weekly working hours in the public administration sector, selected countries, 2024">
    <g class="axis">
      <line x1="250" y1="110" x2="250" y2="640" class="grid"/>
      <text x="250" y="662" text-anchor="middle">30</text>
      <line x1="320" y1="110" x2="320" y2="640" class="tick"/><text x="320" y="662" text-anchor="middle">31</text>
      <line x1="390" y1="110" x2="390" y2="640" class="tick"/><text x="390" y="662" text-anchor="middle">32</text>
      <line x1="460" y1="110" x2="460" y2="640" class="tick"/><text x="460" y="662" text-anchor="middle">33</text>
      <line x1="530" y1="110" x2="530" y2="640" class="tick"/><text x="530" y="662" text-anchor="middle">34</text>
      <line x1="600" y1="110" x2="600" y2="640" class="tick"/><text x="600" y="662" text-anchor="middle">35</text>
      <line x1="670" y1="110" x2="670" y2="640" class="tick"/><text x="670" y="662" text-anchor="middle">36</text>
      <line x1="740" y1="110" x2="740" y2="640" class="tick"/><text x="740" y="662" text-anchor="middle">37</text>
      <line x1="810" y1="110" x2="810" y2="640" class="tick"/><text x="810" y="662" text-anchor="middle">38</text>
      <line x1="880" y1="110" x2="880" y2="640" class="tick"/><text x="880" y="662" text-anchor="middle">39</text>
      <line x1="950" y1="110" x2="950" y2="640" class="grid"/>
      <text x="950" y="662" text-anchor="middle">40</text>
      <text x="600" y="698" text-anchor="middle" class="axis-title">Hours per week</text>
    </g>

    <!-- Bars (ascending). width = (value-30)*70 -->
    <!-- France, Ireland, Portugal 35 -->
    <text class="label" x="240" y="127" text-anchor="end">France, Ireland, Portugal</text>
    <rect class="bar-eu14" x="250" y="113" width="350" height="28"></rect>
    <text class="value-in" x="590" y="132" text-anchor="end">35</text>

    <!-- Spain 35.8 -->
    <text class="label" x="240" y="169" text-anchor="end">Spain</text>
    <rect class="bar-eu14" x="250" y="155" width="406" height="28"></rect>
    <text class="value-in" x="646" y="174" text-anchor="end">35.8</text>

    <!-- Italy, Netherlands 36 -->
    <text class="label" x="240" y="211" text-anchor="end">Italy, Netherlands</text>
    <rect class="bar-eu14" x="250" y="197" width="420" height="28"></rect>
    <text class="value-in" x="660" y="216" text-anchor="end">36</text>

    <!-- Finland 36.8 -->
    <text class="label" x="240" y="253" text-anchor="end">Finland</text>
    <rect class="bar-eu14" x="250" y="239" width="476" height="28"></rect>
    <text class="value-in" x="716" y="258" text-anchor="end">36.8</text>

    <!-- Denmark 37 -->
    <text class="label" x="240" y="295" text-anchor="end">Denmark</text>
    <rect class="bar-eu14" x="250" y="281" width="490" height="28"></rect>
    <text class="value-in" x="730" y="300" text-anchor="end">37</text>

    <!-- Norway 37.5 (grey) -->
    <text class="label" x="240" y="337" text-anchor="end">Norway</text>
    <rect class="bar-nor" x="250" y="323" width="525" height="28"></rect>
    <text class="value-in" x="765" y="342" text-anchor="end">37.5</text>

    <!-- Cyprus, Slovakia 37.5 (EU13) -->
    <text class="label" x="240" y="379" text-anchor="end">Cyprus, Slovakia</text>
    <rect class="bar-eu13" x="250" y="365" width="525" height="28"></rect>
    <text class="value-in" x="765" y="384" text-anchor="end">37.5</text>

    <!-- Belgium 38 -->
    <text class="label" x="240" y="421" text-anchor="end">Belgium</text>
    <rect class="bar-eu14" x="250" y="407" width="560" height="28"></rect>
    <text class="value-in" x="800" y="426" text-anchor="end">38</text>

    <!-- Germany 39.2 -->
    <text class="label" x="240" y="463" text-anchor="end">Germany</text>
    <rect class="bar-eu14" x="250" y="449" width="644" height="28"></rect>
    <text class="value-in" x="884" y="468" text-anchor="end">39.2</text>

    <!-- Sweden 39.8 -->
    <text class="label" x="240" y="505" text-anchor="end">Sweden</text>
    <rect class="bar-eu14" x="250" y="491" width="686" height="28"></rect>
    <text class="value-in" x="926" y="510" text-anchor="end">39.8</text>

    <!-- Bulgaria, Croatia, Estonia, Hungary, Latvia, Lithuania, Malta, Poland, Romania 40 (EU13) -->
    <text class="label" x="240" y="547" text-anchor="end">Bulgaria, Croatia, Estonia, Hungary, Latvia, Lithuania, Malta, Poland, Romania</text>
    <rect class="bar-eu13" x="250" y="533" width="700" height="28"></rect>
    <text class="value-in" x="940" y="552" text-anchor="end">40</text>

    <!-- Austria, Greece, Luxembourg 40 -->
    <text class="label" x="240" y="589" text-anchor="end">Austria, Greece, Luxembourg</text>
    <rect class="bar-eu14" x="250" y="575" width="700" height="28"></rect>
    <text class="value-in" x="940" y="594" text-anchor="end">40</text>

    <!-- Reference lines: EU14 36.9; EU27 37.7; EU13 39.8 -->
    <line x1="733" y1="110" x2="733" y2="640" class="vline14"/>
    <line x1="789" y1="110" x2="789" y2="640" class="vline27"/>
    <line x1="936" y1="110" x2="936" y2="640" class="vline13"/>

    <g font-size="13">
      <text x="733" y="40" text-anchor="middle" class="note14">EU14, 36.9</text>
      <text x="789" y="62" text-anchor="middle" class="note27">EU27, 37.7</text>
      <text x="936" y="84" text-anchor="middle" class="note13">EU13, 39.8</text>
    </g>
  </svg>

  <div class="actions">
    <button id="dlCSV">Download data (CSV)</button>
    <button id="dlPNG">Download image (PNG)</button>
  </div>
</div>

<script>
/* ====== CSV for export ====== */
const CSV_ROWS = [
  ["Country","Hours"],
  ["France, Ireland, Portugal","35"],
  ["Spain","35.8"],
  ["Italy, Netherlands","36"],
  ["Finland","36.8"],
  ["Denmark","37"],
  ["Norway","37.5"],
  ["Cyprus, Slovakia","37.5"],
  ["Belgium","38"],
  ["Germany","39.2"],
  ["Sweden","39.8"],
  ["Bulgaria, Croatia, Estonia, Hungary, Latvia, Lithuania, Malta, Poland, Romania","40"],
  ["Austria, Greece, Luxembourg","40"],
  ["EU27","37.7"],
  ["EU13","39.8"],
  ["EU14","36.9"]
];

/* ====== Title (export-only) ====== */
let _chartTitle = 'Collectively agreed weekly working hours in the public administration sector, selected countries, 2024';
function setChartTitle(v){ _chartTitle = String(v||'').trim(); }
window.setChartTitle = setChartTitle;
try{
  const p = new URLSearchParams(location.search);
  if (p.has('title')) setChartTitle(p.get('title'));
}catch{}

/* ====== Filename helper (first 20 chars of title) ====== */
function safeFile(s){return String(s).replace(/[<>:"/\\|?*\u0000-\u001F]/g,'-').replace(/\s+/g,' ').trim();}
function exportName(kind){
  const base = _chartTitle || 'Working time';
  return safeFile(`${base.slice(0,20)}_${kind}`);
}

/* ====== Highcharts-like shim with wrapper export ====== */
window.chart = {
  getCSV(){
    return CSV_ROWS.map(row =>
      row.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v).join(',')
    ).join('\n');
  },
  exportChartLocal({type='image/png', filename='chart'} = {}){
    const srcSvg = document.getElementById('chart');
    if (!srcSvg) return;

    const vb = srcSvg.viewBox.baseVal;
    const PAD_TOP = _chartTitle ? 72 : 0;

    const NS = 'http://www.w3.org/2000/svg';
    const wrapper = document.createElementNS(NS,'svg');
    wrapper.setAttribute('xmlns','http://www.w3.org/2000/svg');
    wrapper.setAttribute('viewBox', `0 0 ${vb.width} ${vb.height + PAD_TOP}`);
    wrapper.setAttribute('width', vb.width);
    wrapper.setAttribute('height', vb.height + PAD_TOP);

    const cssText = Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
    const style = document.createElementNS(NS,'style');
    style.textContent = cssText + `\ntext,tspan{font-family:Roboto,"Roboto Fallback",sans-serif;}`;
    wrapper.appendChild(style);

    if (_chartTitle){
      const titleNode = document.createElementNS(NS,'text');
      titleNode.setAttribute('x', String(vb.width/2));
      titleNode.setAttribute('y', '32');
      titleNode.setAttribute('text-anchor','middle');
      titleNode.setAttribute('style','font-size:22px;font-weight:700;fill:#2e2e2e;font-family:Roboto,"Roboto Fallback",sans-serif');
      titleNode.textContent = _chartTitle;
      wrapper.appendChild(titleNode);
    }

    const g = document.createElementNS(NS,'g');
    g.setAttribute('transform', `translate(0,${PAD_TOP})`);
    Array.from(srcSvg.childNodes).forEach(n=>{
      if (n.nodeName.toLowerCase()==='style') return;
      g.appendChild(n.cloneNode(true));
    });
    wrapper.appendChild(g);

    const serializer = new XMLSerializer();
    const svgStr = serializer.serializeToString(wrapper);

    const canvas = document.createElement('canvas');
    canvas.width = vb.width; canvas.height = vb.height + PAD_TOP;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const img = new Image();
    img.onload = function(){
      ctx.drawImage(img,0,0);
      canvas.toBlob(blob=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (filename || 'chart') + (type==='image/png'?'.png':'');
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },0);
      });
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  }
};

/* ====== Hidden buttons & robust postMessage hooks ====== */
const btnCSV = document.getElementById('dlCSV');
const btnPNG = document.getElementById('dlPNG');
function doCSVDownload(){
  const csv = chart.getCSV();
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = exportName('data') + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },0);
}
function doPNGDownload(){ chart.exportChartLocal({ type:'image/png', filename: exportName('img') }); }
if (btnCSV) btnCSV.onclick = doCSVDownload;
if (btnPNG) btnPNG.onclick = doPNGDownload;

window.triggerExportCSV = doCSVDownload;
window.triggerExportPNG = doPNGDownload;
window.addEventListener('message',(event)=>{
  const d = event.data;
  if (d && typeof d==='object' && (d.type==='set-title' || d.action==='set-title')) {
    setChartTitle(d.value || d.title || '');
    return;
  }
  const cmd = (typeof d==='string' ? d :
               d && typeof d==='object' ? (d.type||d.action||d.cmd||d.command||d.event||d.name||
               (d.data & (d.data.type||d.data.action||d.data.cmd||d.data.command))) : null);
  if (!cmd) return;
  const c = String(cmd).toLowerCase();
  if (['download-png','png','image','export-png'].includes(c)) return doPNGDownload();
  if (['download-csv','csv','data','export-csv'].includes(c)) return doCSVDownload();
});
</script>
</body>
</html>
