<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Retail sector – SVG export</title>
<style>
  :root{
    --blue:#0d5675;
    --green:#3aa654;
    --line14:#1f7fbf;
    --line27:#3bb3ff;
    --line13:#3aa654;
    --axis:#7a7a7a;
    --grid:#e6e6e6;
  }
  html,body{height:100%}
  body{margin:0;background:#ffffff;font-family:Segoe UI, Roboto, "Roboto Fallback", Helvetica, Arial, sans-serif}
  .wrap{width:1020px;max-width:100%;margin:0 auto;background:transparent}
  svg{display:block;width:100%;height:auto;outline:none}

  .label{font-size:15px;fill:#4a4a4a}
  .value-in{font-size:14px;fill:#ffffff;font-weight:700}
  .axis text{font-size:12px;fill:var(--axis)}
  .axis-title{font-size:20px;fill:#6a6a6a}
  .grid{stroke:var(--grid);stroke-width:1}
  .tick{stroke:#e2e2e2;stroke-width:1}
  .vline14{stroke:var(--line14);stroke-width:3;stroke-dasharray:6 6}
  .vline27{stroke:var(--line27);stroke-width:3;stroke-dasharray:6 6}
  .vline13{stroke:var(--line13);stroke-width:3;stroke-dasharray:6 6}
  .note14{fill:var(--line14)}
  .note27{fill:var(--line27)}
  .note13{fill:var(--line13)}
  .bar-eu14{fill:var(--blue)}
  .bar-eu13{fill:var(--green)}
  .bar-nor{fill:#cfcfcf}
  .actions{display:none}
</style>
</head>
<body>
<div class="wrap">
  <!-- Chart only (no visible title node) -->
  <svg id="chart" viewBox="0 0 1020 820" role="img" aria-label="Collectively agreed weekly working hours in the retail sector, selected countries, 2024">
    <!-- Left margin widened: axis starts at x=300 -->
    <g class="axis">
      <line x1="300" y1="110" x2="300" y2="640" class="grid"/>
      <text x="300" y="705" text-anchor="middle">30</text>

      <line x1="370" y1="110" x2="370" y2="640" class="tick"/><text x="370" y="705" text-anchor="middle">31</text>
      <line x1="440" y1="110" x2="440" y2="640" class="tick"/><text x="440" y="705" text-anchor="middle">32</text>
      <line x1="510" y1="110" x2="510" y2="640" class="tick"/><text x="510" y="705" text-anchor="middle">33</text>
      <line x1="580" y1="110" x2="580" y2="640" class="tick"/><text x="580" y="705" text-anchor="middle">34</text>
      <line x1="650" y1="110" x2="650" y2="640" class="tick"/><text x="650" y="705" text-anchor="middle">35</text>
      <line x1="720" y1="110" x2="720" y2="640" class="tick"/><text x="720" y="705" text-anchor="middle">36</text>
      <line x1="790" y1="110" x2="790" y2="640" class="tick"/><text x="790" y="705" text-anchor="middle">37</text>
      <line x1="860" y1="110" x2="860" y2="640" class="tick"/><text x="860" y="705" text-anchor="middle">38</text>
      <line x1="930" y1="110" x2="930" y2="640" class="tick"/><text x="930" y="705" text-anchor="middle">39</text>
      <line x1="1000" y1="110" x2="1000" y2="640" class="grid"/>
      <text x="1000" y="662" text-anchor="middle">40</text>

      <text x="600" y="725" text-anchor="middle" class="axis-title">Hours per week</text>
    </g>

    <!-- Bars (ascending) — width = (value-30)*70; values anchored end at x = 300 + width - 10 -->
    <!-- France 35.9 -->
    <text class="label" x="290" y="127" text-anchor="end">France</text>
    <rect class="bar-eu14" x="300" y="113" width="413" height="28"></rect>
    <text class="value-in" x="703" y="132" text-anchor="end">35.9</text>

    <!-- Belgium 36.7 -->
    <text class="label" x="290" y="169" text-anchor="end">Belgium</text>
    <rect class="bar-eu14" x="300" y="155" width="469" height="28"></rect>
    <text class="value-in" x="759" y="174" text-anchor="end">36.7</text>

    <!-- Denmark 37 -->
    <text class="label" x="290" y="211" text-anchor="end">Denmark</text>
    <rect class="bar-eu14" x="300" y="197" width="490" height="28"></rect>
    <text class="value-in" x="780" y="216" text-anchor="end">37</text>

    <!-- Norway 37.5 (grey) -->
    <text class="label" x="290" y="253" text-anchor="end">Norway</text>
    <rect class="bar-nor" x="300" y="239" width="525" height="28"></rect>
    <text class="value-in" x="815" y="258" text-anchor="end">37.5</text>

    <!-- Finland 37.5 -->
    <text class="label" x="290" y="295" text-anchor="end">Finland</text>
    <rect class="bar-eu14" x="300" y="281" width="525" height="28"></rect>
    <text class="value-in" x="815" y="300" text-anchor="end">37.5</text>

    <!-- Germany 37.6 -->
    <text class="label" x="290" y="337" text-anchor="end">Germany</text>
    <rect class="bar-eu14" x="300" y="323" width="532" height="28"></rect>
    <text class="value-in" x="822" y="342" text-anchor="end">37.6</text>

    <!-- Netherlands 38 -->
    <text class="label" x="290" y="379" text-anchor="end">Netherlands</text>
    <rect class="bar-eu14" x="300" y="365" width="560" height="28"></rect>
    <text class="value-in" x="850" y="384" text-anchor="end">38</text>

    <!-- Cyprus 38 (EU13) -->
    <text class="label" x="290" y="421" text-anchor="end">Cyprus</text>
    <rect class="bar-eu13" x="300" y="407" width="560" height="28"></rect>
    <text class="value-in" x="850" y="426" text-anchor="end">38</text>

    <!-- Sweden 38.25 -->
    <text class="label" x="290" y="463" text-anchor="end">Sweden</text>
    <rect class="bar-eu14" x="300" y="449" width="578" height="28"></rect>
    <text class="value-in" x="868" y="468" text-anchor="end">38.25</text>

    <!-- Austria 38.5 -->
    <text class="label" x="290" y="505" text-anchor="end">Austria</text>
    <rect class="bar-eu14" x="300" y="491" width="595" height="28"></rect>
    <text class="value-in" x="885" y="510" text-anchor="end">38.5</text>

    <!-- Spain 39.1 -->
    <text class="label" x="290" y="547" text-anchor="end">Spain</text>
    <rect class="bar-eu14" x="300" y="533" width="637" height="28"></rect>
    <text class="value-in" x="927" y="552" text-anchor="end">39.1</text>

    <!-- Portugal 39.9 -->
    <text class="label" x="290" y="589" text-anchor="end">Portugal</text>
    <rect class="bar-eu14" x="300" y="575" width="693" height="28"></rect>
    <text class="value-in" x="983" y="594" text-anchor="end">39.9</text>

    <!-- Greece, Italy, Luxembourg 40 (EU14) -->
    <text class="label" x="290" y="631" text-anchor="end">Greece, Italy, Luxembourg</text>
    <rect class="bar-eu14" x="300" y="617" width="700" height="28"></rect>
    <text class="value-in" x="990" y="636" text-anchor="end">40</text>

    <!-- Croatia, Czechia, Malta, Slovakia, Slovenia 40 (EU13) -->
    <text class="label" x="290" y="673" text-anchor="end">Croatia, Czechia, Malta, Slovakia, Slovenia</text>
    <rect class="bar-eu13" x="300" y="659" width="700" height="28"></rect>
    <text class="value-in" x="990" y="678" text-anchor="end">40</text>

    <!-- Reference lines: EU14 38.1; EU27 38.6; EU13 40.0 -->
    <line x1="867" y1="110" x2="867" y2="640" class="vline14"/>
    <line x1="902" y1="110" x2="902" y2="640" class="vline27"/>
    <line x1="1000" y1="110" x2="1000" y2="640" class="vline13"/>

    <g font-size="13">
      <text x="867" y="40" text-anchor="middle" class="note14">EU14, 38.1</text>
      <text x="902" y="62" text-anchor="middle" class="note27">EU27, 38.6</text>
      <text x="1000" y="84" text-anchor="middle" class="note13">EU13, 40.0</text>
    </g>
  </svg>

  <div class="actions">
    <button id="dlCSV">Download data (CSV)</button>
    <button id="dlPNG">Download image (PNG)</button>
  </div>
</div>

<script>
/* ====== CSV (export) ====== */
const CSV_ROWS = [
  ["Country","Hours"],
  ["France","35.9"],
  ["Belgium","36.7"],
  ["Denmark","37"],
  ["Norway","37.5"],
  ["Finland","37.5"],
  ["Germany","37.6"],
  ["Netherlands","38"],
  ["Cyprus","38"],
  ["Sweden","38.25"],
  ["Austria","38.5"],
  ["Spain","39.1"],
  ["Portugal","39.9"],
  ["Greece, Italy, Luxembourg","40"],
  ["Croatia, Czechia, Malta, Slovakia, Slovenia","40"],
  ["EU27","38.6"],
  ["EU13","40.0"],
  ["EU14","38.1"]
];

/* ====== Title (export-only) ====== */
let _chartTitle = 'Collectively agreed weekly working hours in the retail sector, selected countries, 2024';
function setChartTitle(v){ _chartTitle = String(v||'').trim(); }
window.setChartTitle = setChartTitle;
try{
  const p = new URLSearchParams(location.search);
  if (p.has('title')) setChartTitle(p.get('title'));
}catch{}

/* ====== Filename helper (first 20 chars of title) ====== */
function safeFile(s){return String(s).replace(/[<>:"/\\|?*\u0000-\u001F]/g,'-').replace(/\s+/g,' ').trim();}
function exportName(kind){
  const base = _chartTitle || 'Working time';
  return safeFile(`${base.slice(0,20)}_${kind}`);
}

/* ====== Highcharts-like shim with wrapper export ====== */
window.chart = {
  getCSV(){
    return CSV_ROWS.map(row =>
      row.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v).join(',')
    ).join('\n');
  },
  exportChartLocal({type='image/png', filename='chart'} = {}){
    const srcSvg = document.getElementById('chart');
    if (!srcSvg) return;

    const vb = srcSvg.viewBox.baseVal;
    const PAD_TOP = _chartTitle ? 72 : 0;

    const NS = 'http://www.w3.org/2000/svg';
    const wrapper = document.createElementNS(NS,'svg');
    wrapper.setAttribute('xmlns','http://www.w3.org/2000/svg');
    wrapper.setAttribute('viewBox', `0 0 ${vb.width} ${vb.height + PAD_TOP}`);
    wrapper.setAttribute('width', vb.width);
    wrapper.setAttribute('height', vb.height + PAD_TOP);

    const cssText = Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
    const style = document.createElementNS(NS,'style');
    style.textContent = cssText + `\ntext,tspan{font-family:Roboto,"Roboto Fallback",sans-serif;}`;
    wrapper.appendChild(style);

    if (_chartTitle){
      const titleNode = document.createElementNS(NS,'text');
      titleNode.setAttribute('x', String(vb.width/2));
      titleNode.setAttribute('y', '32');
      titleNode.setAttribute('text-anchor','middle');
      titleNode.setAttribute('style','font-size:22px;font-weight:700;fill:#2e2e2e;font-family:Roboto,"Roboto Fallback",sans-serif');
      titleNode.textContent = _chartTitle;
      wrapper.appendChild(titleNode);
    }

    const g = document.createElementNS(NS,'g');
    g.setAttribute('transform', `translate(0,${PAD_TOP})`);
    Array.from(srcSvg.childNodes).forEach(n=>{
      if (n.nodeName.toLowerCase()==='style') return;
      g.appendChild(n.cloneNode(true));
    });
    wrapper.appendChild(g);

    const serializer = new XMLSerializer();
    const svgStr = serializer.serializeToString(wrapper);

    const canvas = document.createElement('canvas');
    canvas.width = vb.width; canvas.height = vb.height + PAD_TOP;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const img = new Image();
    img.onload = function(){
      ctx.drawImage(img,0,0);
      canvas.toBlob(blob=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (filename || 'chart') + (type==='image/png'?'.png':'');
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },0);
      });
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  }
};

/* ====== Hidden buttons & robust postMessage hooks ====== */
const btnCSV = document.getElementById('dlCSV');
const btnPNG = document.getElementById('dlPNG');
function doCSVDownload(){
  const csv = chart.getCSV();
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = exportName('data') + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },0);
}
function doPNGDownload(){ chart.exportChartLocal({ type:'image/png', filename: exportName('img') }); }
if (btnCSV) btnCSV.onclick = doCSVDownload;
if (btnPNG) btnPNG.onclick = doPNGDownload;

window.triggerExportCSV = doCSVDownload;
window.triggerExportPNG = doPNGDownload;
window.addEventListener('message',(event)=>{
  const d = event.data;
  if (d && typeof d==='object' && (d.type==='set-title' || d.action==='set-title')) {
    setChartTitle(d.value || d.title || '');
    return;
  }
  const cmd = (typeof d==='string' ? d :
               d && typeof d==='object' ? (d.type||d.action||d.cmd||d.command||d.event||d.name||
               (d.data && (d.data.type||d.data.action||d.data.cmd||d.data.command))) : null);
  if (!cmd) return;
  const c = String(cmd).toLowerCase();
  if (['download-png','png','image','export-png'].includes(c)) return doPNGDownload();
  if (['download-csv','csv','data','export-csv'].includes(c)) return doCSVDownload();
});
</script>
</body>
</html>
