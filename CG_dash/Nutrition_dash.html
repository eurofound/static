<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nutrition</title>
  <script>
    var EF_LANGUAGES = ['en'];
    (function () {
      var root = document.documentElement;
      var params = new URLSearchParams(location.search);
      var theme = params.get('theme');
      root.dataset.theme = theme === 'light' || theme === 'dark' ? theme :
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var lang = params.get('lang');
      root.lang = EF_LANGUAGES.includes(lang) ? lang : 'en';
      if (window.parent !== window) root.dataset.embedded = '';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link rel="stylesheet" href="https://www.eurofound.europa.eu/api/embed/v1/theme.css">
  <link rel="stylesheet" href="./erm-palette.css">
  <link rel="stylesheet" href="./child-poverty-embed.css?v=20261118-dropdown-flags">
  <script defer src="https://cdn.jsdelivr.net/npm/highcharts@12.4.0/highcharts.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highcharts@12.4.0/modules/map.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@highcharts/map-collection@2.3.0/custom/europe.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highcharts@12.4.0/modules/exporting.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highcharts@12.4.0/modules/accessibility.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script defer src="./child-guarantee-sources.js?v=20261118-map-playback"></script>
  <script defer src="./child-poverty-embed.js?v=20261118-dropdown-flags"></script>
</head>
<body class="ef-embed">
<main>
  <div class="controls" id="controls" hidden>
    <div class="indicator-control">
      <div class="indicator-label"><label class="ef-label" for="indicator">Indicator</label><span class="ef-text-muted" id="indicatorCount" aria-hidden="true"></span></div>
      <div class="indicator-nav">
        <button class="ef-button indicator-step" id="previousIndicator" aria-label="Previous indicator" title="Previous indicator">
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m12 5-5 5 5 5"/></svg>
        </button>
        <select class="ef-select" id="indicator"></select>
        <button class="ef-button indicator-step" id="nextIndicator" aria-label="Next indicator" title="Next indicator">
          <svg aria-hidden="true" viewBox="0 0 20 20"><path d="m8 5 5 5-5 5"/></svg>
        </button>
      </div>
    </div>
    <fieldset class="breakdown-control" id="breakdownControl">
      <legend class="ef-label">Breakdown</legend>
      <div class="chip-row" id="breakdown"></div>
    </fieldset>
    <div class="view-controls">
      <div class="ef-tabs view-options" role="tablist" aria-label="Chart view">
        <button class="ef-tab" id="tLine" data-view="line" role="tab" aria-controls="chartPanel" aria-selected="true">Trend</button>
        <button class="ef-tab" id="tBar" data-view="bar" role="tab" aria-controls="chartPanel" aria-selected="false" tabindex="-1">Bar chart</button>
        <button class="ef-tab" id="tMap" data-view="map" role="tab" aria-controls="chartPanel" aria-selected="false" tabindex="-1">Map</button>
      </div>
      <div id="countryFilter" class="country-filter">
        <label class="ef-label" for="countryToggle">Countries</label>
        <button class="ef-select" id="countryToggle" aria-expanded="false" aria-controls="countryPanel">
          <span id="countryCount">Choose countries</span>
          <svg aria-hidden="true" viewBox="0 0 16 16"><path d="m3 5 5 5 5-5z"/></svg>
        </button>
        <div class="ef-popover country-panel" id="countryPanel" hidden>
          <label class="ef-label" for="countrySearch">Search countries</label>
          <input class="country-search" id="countrySearch" type="search" autocomplete="off">
          <div class="country-actions"><span id="countryHelp">Select up to nine countries.</span><button class="ef-button" id="clearCountries">Clear</button></div>
          <div class="country-list" id="countryList" role="group" aria-label="Countries" aria-describedby="countryHelp"></div>
        </div>
      </div>
      <div id="yearFilter" class="year-filter" hidden>
        <label class="ef-label" for="year">Year</label>
        <select class="ef-select" id="year"></select>
        <button class="ef-button year-play" id="playYears" type="button" aria-label="Play years" title="Play years" aria-pressed="false" hidden>
          <svg class="play-icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M4 2 14 8 4 14Z"/></svg>
          <svg class="pause-icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="sr-only" id="indicatorAnnouncement" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="status" role="status" aria-live="polite" class="ef-notice">Loading nutrition data…</div>
  <button class="ef-button" id="retry" hidden>Try again</button>
  <section class="chart-panel" id="chartPanel" role="tabpanel" aria-labelledby="tLine">
    <div id="chart" aria-busy="true"></div>
  </section>
  <div class="view-notes" id="viewNotes"></div>
</main>
</body>
</html>
