<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>European Jobs Monitor – Dashboard</title>
  <script>
    var EF_LANGUAGES = ['en'];
    (function () {
      var root = document.documentElement, params = new URLSearchParams(location.search);
      var theme = params.get('theme');
      root.dataset.theme = theme === 'light' || theme === 'dark' ? theme :
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      root.lang = EF_LANGUAGES.includes(params.get('lang')) ? params.get('lang') : 'en';
      if (window.parent !== window) root.dataset.embedded = '';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link rel="stylesheet" href="https://www.eurofound.europa.eu/api/embed/v1/theme.css">
  <link rel="stylesheet" href="./ejm-palette.css?v=20261118-embed">
  <link rel="stylesheet" href="./ejm-embed.css?v=20261118-embed">
  <script defer src="https://cdn.jsdelivr.net/npm/highcharts@12.4.0/highcharts.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highcharts@12.4.0/highcharts-more.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highcharts@12.4.0/modules/exporting.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highcharts@12.4.0/modules/accessibility.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script defer src="./ejm-embed.js?v=20261118-embed"></script>
</head>
<body class="ef-embed">


<main>
<div id="status" class="ef-notice" role="status" aria-live="polite">Loading European Jobs Monitor data…</div>
<button id="retry" class="ef-button" hidden>Try again</button>
<div id="controls" hidden>
  <!-- LEFT -->
  <div>
    <div class="country-control">
      <label class="ef-label" for="flagBtn">Select country</label>
      <!-- visible flag dropdown -->
      <div id="countryUI" class="flag-select"></div>
      <!-- hidden native select kept for existing logic -->
      <select id="countrySel" style="display:none"></select>
    </div>

    <fieldset>
      <legend class="ef-label">Year</legend>
      <div id="yearPills" class="pill-row"></div>
    </fieldset>

    <fieldset>
      <legend class="ef-label">Filter by</legend>
      <div id="filterList" class="radio-list"></div>
    </fieldset>

    <fieldset>
      <legend class="ef-label">Job quality criterion</legend>
      <div id="critList" class="radio-list"></div>
    </fieldset>
  </div>

  <!-- RIGHT -->
  <div>
    <div class="chart-wrap">
      <div id="container" aria-busy="true"></div>
    </div>

    <!-- Centered row under the chart: metric pills + radar/bar icons -->
    <div id="metricRow" class="metric-row">
      <div id="metricPills" class="pill-row"></div>

      <!-- toggles only visible for Total employment -->
      <div id="chartToggles" class="chart-toggles hidden" aria-label="Chart view">
        <button id="btnBar" class="ef-button tbtn active" aria-pressed="true" type="button" title="Bar chart" aria-label="Bar chart">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <rect x="3"  y="10" width="4" height="10" rx="1"></rect>
            <rect x="10" y="6"  width="4" height="14" rx="1"></rect>
            <rect x="17" y="3"  width="4" height="17" rx="1"></rect>
          </svg>
        </button>
        <button id="btnRadar" class="ef-button tbtn" aria-pressed="false" type="button" title="Radar chart" aria-label="Radar chart">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <polygon points="12,3 20,8 17,19 7,19 4,8" fill="none" stroke="currentColor" stroke-width="1.5"></polygon>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
        </button>
      </div>
    </div>

    <div id="viewNotes" class="view-notes"></div>

  </div>
</div>

</main>
</body>
</html>
