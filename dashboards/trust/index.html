<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Compare trust indicators across European countries and years." />
<title>Trust Explorer — Eurofound</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.7.0/css/flag-icons.min.css"/>
<style>
:root{--low:#C35A08;--mid:#C8CED3;--high:#0B3D56;--second:#1B2110;--ink:#17202a;--muted:#647180;--grid:#e9e9e9;--line:#dfe5e8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:var(--ink)}
.wrap{max-width:1200px;margin:18px auto 30px;padding:0 12px}
h2{margin:6px 0;text-align:center;font-size:28px;letter-spacing:-.025em}
.controls-stack{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 6px}
.controls-row{display:flex;align-items:center;justify-content:center;gap:12px;max-width:100%}
.legend-row{margin-top:2px;transform:scale(.9);transform-origin:center}
.select-wrap{position:relative;display:inline-block}
.select-wrap select{min-width:240px;min-height:44px;max-width:100%;padding:10px 40px 10px 14px;border:1px solid #d5dbe3;border-radius:12px;background:#fff;font-size:14px;line-height:1;color:#111;appearance:none;background-image:none}
.select-wrap select:focus{outline:none;border-color:#b8c2cf;box-shadow:0 0 0 3px rgba(14,91,118,.1)}
.select-wrap.year select{min-width:150px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke="%23222" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');background-repeat:no-repeat;background-position:right 12px center;background-size:12px 8px}
.select-wrap.year select.soft{color:#7c8796}
.year-controls{display:flex;align-items:center;gap:6px}
.play-years{display:grid;place-items:center;flex:0 0 40px;width:40px;height:44px;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.play-years:hover,.play-years[aria-pressed="true"]{background:#f1f5f7;color:var(--high)}
.play-years:focus-visible{outline:2px solid var(--high);outline-offset:2px}
.play-years:disabled{opacity:.4;cursor:default}
.play-years svg{width:18px;height:18px;fill:currentColor}
.play-years [hidden]{display:none}
.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:#111;font-size:22px;line-height:1;padding:0;cursor:pointer}
.clear-btn:hover{color:#000;transform:translateY(-50%) scale(1.05)}
.clear-btn:active{transform:translateY(-50%) scale(.98)}
.clear-btn[hidden]{display:none}
.legend-eu{display:flex;align-items:center;gap:8px;color:#333;font-size:14px}
.legend-eu .chip{width:14px;height:14px;border-radius:50%;background:var(--mid);outline:2px solid #000;outline-offset:-1px}
svg{display:block;width:100%;height:auto}
.label{fill:#111;font-size:18px;font-weight:600;dominant-baseline:middle}
.row-rule{stroke:var(--grid);stroke-width:1}
.dot{stroke:#fff;stroke-width:1}
.dot.emph{stroke:#222c4c;stroke-width:2}
.eu-dot{stroke:#000;stroke-width:3}
.highlight{fill:none;stroke:#6b7280;stroke-opacity:.55;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.highlight-pin{fill:none;stroke:#0f1d3a;stroke-width:.6;pointer-events:none}
.highlight.second{stroke:var(--high);stroke-opacity:.55}
.highlight-pin.second{stroke:var(--high);stroke-opacity:.6}
.band-layer{pointer-events:none}
.between-band{fill:#0B3D56;fill-opacity:.02;stroke:#0B3D56;stroke-opacity:.12;stroke-width:0;mix-blend-mode:multiply}
.axis-cues text{font-size:22px;font-weight:800}
.axis-cues .low{fill:var(--low)}
.axis-cues .high{fill:#0B3D56}
.name-fo{pointer-events:none}
.flag-row{display:inline-flex;width:max-content;height:30px;align-items:center;gap:6px;font-weight:800;font-size:18px;color:#111;line-height:1;text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff,0 0 3px rgba(255,255,255,.95);white-space:nowrap}
.flag-row .fi{flex:0 0 24px;width:24px;line-height:18px}
.label-connector{fill:none;stroke:#647180;stroke-width:1;pointer-events:none}
.country-label{pointer-events:none}
.tooltip{max-width:calc(100vw - 24px);z-index:10;position:fixed;background:#111;color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.source-note{display:grid;grid-template-columns:minmax(0,9fr) minmax(0,1fr);align-items:center;border-top:1px solid var(--line);margin-top:16px;padding:18px 0 8px;font-size:14px;line-height:1.6;color:var(--muted)}
.source-note p{margin:8px 0}
.source-copy{min-width:0;padding-right:24px}
.source-logo{display:block;width:100%;height:auto}
.source-note a{color:var(--high);text-underline-offset:3px}
.source-note strong{color:var(--ink)}
.download-status{font-size:14px;color:var(--muted);text-align:right;margin:8px 0}
.download-status:empty{display:none}
@media(max-width:680px){
  .wrap{margin-top:12px;padding:0 16px}
  h2{font-size:24px;line-height:1.2;margin-bottom:16px}
  .controls-stack,.controls-row{width:100%}
  .controls-row{flex-direction:column;gap:8px}
  .select-wrap,.select-wrap select{width:100%;min-width:0}
  .select-wrap select{font-size:16px}
  .select-wrap.year select{min-width:0}
  .year-controls{width:100%}
  .year-controls .select-wrap{flex:1;min-width:0}
  .play-years{flex-basis:44px;width:44px}
  .legend-row{transform:none}
  .label{font-size:16px}
  .flag-row{font-size:16px}
  .axis-cues text{font-size:16px}
  .source-copy{padding-right:12px}
  .source-note{grid-template-columns:minmax(0,1fr) 64px}
}
</style>
</head>
<body>
<main class="wrap">
<h2>Trust indicators dashboard</h2>
<header class="controls-stack">
<div class="controls-row">
<div class="select-wrap country"><select id="countrySel" required aria-label="Country"><option id="countryDisplay" value="" disabled selected hidden>Select a country</option></select><button id="clearSel" class="clear-btn" hidden aria-label="Clear selection">×</button></div>
<div class="year-controls">
<div class="select-wrap year"><select id="yearSel" required class="soft" aria-label="Survey year"></select></div>
<button id="playYears" class="play-years" type="button" aria-label="Play years" title="Play years" aria-pressed="false" aria-controls="yearSel chart" disabled>
<svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5a1 1 0 0 1 1.5-.86l10 6.5a1 1 0 0 1 0 1.72l-10 6.5A1 1 0 0 1 6 16.5Z"/></svg>
<svg class="pause-icon" viewBox="0 0 20 20" aria-hidden="true" hidden><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>
</button>
</div>
</div>
<div class="legend-row"><div class="legend-eu" title="EU27 average"><div class="chip"></div><span>EU27 average</span></div></div>
</header>
<svg id="chart" width="1100" height="734" viewBox="0 0 1100 734" aria-label="Trust indicators beeswarm chart"></svg>
<p id="downloadStatus" class="download-status" role="status" aria-live="polite"></p>
<footer class="source-note" aria-label="Source and note">
<p class="source-copy"><strong>Source:</strong> Eurofound, <a href="https://www.eurofound.europa.eu/en/surveys-and-data/surveys/living-and-working-in-the-eu-e-survey">Living and working in the EU e-survey</a>. <strong>Note:</strong> Survey respondents rate how much they trust each entity on a scale from 1 (Do not trust at all) to 10 (Trust completely).</p>
<img class="source-logo" src="./eurofound-logo.svg" alt="Eurofound" width="244" height="162">
</footer>
</main>
<div id="tooltip" class="tooltip" style="display:none"></div>
<script src="./label-layout.js?v=20261027"></script>
<script src="./year-playback.js?v=20261028"></script>
<script src="./chart.js?v=20261028"></script>
<script src="./exports.js?v=20261028"></script>
</body>
</html>
