<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Compare trust indicators across European countries and years." />
<title>Trust Explorer — Eurofound</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@6.7.0/css/flag-icons.min.css"/>
<style>
:root{--low:#C35A08;--mid:#C8CED3;--high:#0B3D56;--second:#1B2110;--ink:#17202a;--muted:#647180;--grid:#e9e9e9;--line:#dfe5e8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:var(--ink)}
.bar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.bar a{text-decoration:none;color:var(--ink);font-weight:750}
.bar strong{font-size:14px}
.wrap{max-width:1200px;margin:18px auto 30px;padding:0 12px}
h2{margin:6px 0;text-align:center;font-size:28px;letter-spacing:-.025em}
.controls-stack{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 6px}
.controls-row{display:flex;align-items:center;justify-content:center;gap:12px}
.legend-row{margin-top:2px;transform:scale(.9);transform-origin:center}
.select-wrap{position:relative;display:inline-block}
.select-wrap select{min-width:240px;padding:10px 40px 10px 14px;border:1px solid #d5dbe3;border-radius:12px;background:#fff;font-size:14px;line-height:1;color:#111;appearance:none;background-image:none}
.select-wrap select:focus{outline:none;border-color:#b8c2cf;box-shadow:0 0 0 3px rgba(14,91,118,.1)}
.select-wrap.year select{min-width:150px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke="%23222" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');background-repeat:no-repeat;background-position:right 12px center;background-size:12px 8px}
.select-wrap.year select.soft{color:#7c8796}
.clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;color:#111;font-size:22px;line-height:1;padding:0;cursor:pointer}
.clear-btn:hover{color:#000;transform:translateY(-50%) scale(1.05)}
.clear-btn:active{transform:translateY(-50%) scale(.98)}
.clear-btn[hidden]{display:none}
.legend-eu{display:flex;align-items:center;gap:8px;color:#333;font-size:14px}
.legend-eu .chip{width:14px;height:14px;border-radius:50%;background:var(--mid);outline:2px solid #000;outline-offset:-1px}
svg{display:block;width:100%;height:auto}
.label{fill:#111;font-size:18px;font-weight:600;dominant-baseline:middle}
.row-rule{stroke:var(--grid);stroke-width:1}
.dot{stroke:#fff;stroke-width:1}
.dot.emph{stroke:#222c4c;stroke-width:2}
.eu-dot{stroke:#000;stroke-width:3}
.highlight{fill:none;stroke:#6b7280;stroke-opacity:.55;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.highlight-pin{fill:none;stroke:#0f1d3a;stroke-width:.6;pointer-events:none}
.highlight.second{stroke:var(--high);stroke-opacity:.55}
.highlight-pin.second{stroke:var(--high);stroke-opacity:.6}
.band-layer{pointer-events:none}
.between-band{fill:#0B3D56;fill-opacity:.02;stroke:#0B3D56;stroke-opacity:.12;stroke-width:0;mix-blend-mode:multiply}
.axis-cues text{font-size:22px;font-weight:800}
.axis-cues .low{fill:var(--low)}
.axis-cues .high{fill:#0B3D56}
.name-fo{pointer-events:none}
.flag-row{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;color:#111;line-height:1;text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff,0 0 3px rgba(255,255,255,.95);white-space:nowrap}
.tooltip{position:fixed;background:#111;color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media(max-width:680px){.bar{height:58px;padding:0 14px}.bar strong{font-size:12px}.wrap{margin-top:12px}.controls-row{flex-direction:column;gap:8px}.select-wrap,.select-wrap select{width:100%}.select-wrap.year select{min-width:0}}
</style>
</head>
<body>
<header class="bar"><a href="https://www.eurofound.europa.eu/">← Eurofound</a><strong>Trust Explorer</strong></header>
<main class="wrap">
<h2>Trust indicators dashboard</h2>
<header class="controls-stack">
<div class="controls-row">
<div class="select-wrap"><select id="countrySel" required><option id="countryDisplay" value="" disabled selected hidden>Select a country</option></select><button id="clearSel" class="clear-btn" hidden aria-label="Clear selection">×</button></div>
<div class="select-wrap year"><select id="yearSel" required class="soft"></select></div>
</div>
<div class="legend-row"><div class="legend-eu" title="EU27 average"><div class="chip"></div><span>EU27 average</span></div></div>
</header>
<svg id="chart" width="1100" height="640" viewBox="0 0 1100 640" aria-label="Trust indicators beeswarm chart"></svg>
</main>
<div id="tooltip" class="tooltip" style="display:none"></div>
<script>
const CSV_URL="./Trust.csv";
const FLAG_CODE={"European Union":"eu","Austria":"at","Belgium":"be","Bulgaria":"bg","Croatia":"hr","Cyprus":"cy","Czechia":"cz","Denmark":"dk","Estonia":"ee","Finland":"fi","France":"fr","Germany":"de","Greece":"gr","Hungary":"hu","Ireland":"ie","Italy":"it","Latvia":"lv","Lithuania":"lt","Luxembourg":"lu","Malta":"mt","Netherlands":"nl","Poland":"pl","Portugal":"pt","Romania":"ro","Slovakia":"sk","Slovenia":"si","Spain":"es","Sweden":"se"};
const svg=d3.select("#chart"),width=+svg.attr("width"),margin={top:4,right:28,bottom:110,left:270},rowGap=90,r=6,innerW=width-margin.left-margin.right,g=svg.append("g").attr("transform",`translate(${margin.left},${margin.top})`),x=d3.scaleLinear().domain([1,8]).range([0,innerW]),rowY=i=>i*rowGap,labelLeft=-margin.left+24,color=d3.scaleDiverging().domain([1,5,8]).interpolator(d3.interpolateRgbBasis([css("--low"),css("--mid"),css("--high")]));
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
const curve=d3.curveCatmullRom.alpha(.8),lineGen=d3.line().x(d=>d.x).y(d=>d.y).curve(curve),dotsG=g.append("g"),bandG=g.append("g").attr("class","band-layer"),layers={A:{g:g.append("g").attr("class","layer-A"),labelG:g.append("g").attr("class","label-A")},B:{g:g.append("g").attr("class","layer-B"),labelG:g.append("g").attr("class","label-B")}},MOVE_MS=650;
dotsG.raise();
const tip=document.getElementById("tooltip");function showTip(e,p){tip.style.display="block";tip.style.left=e.clientX+12+"px";tip.style.top=e.clientY+12+"px";tip.innerHTML=`<strong>${p.Country}</strong><br>${p.Metric}: ${p.value}`}function hideTip(){tip.style.display="none"}const FADE_OTHER=.2;function applyFade(set){dotsG.selectAll("circle").classed("emph",d=>set.has(d.Country)).attr("opacity",d=>set.size?(set.has(d.Country)?1:FADE_OTHER):1)}
const yearSel=document.getElementById("yearSel"),countrySel=document.getElementById("countrySel"),countryDisplay=document.getElementById("countryDisplay"),clearBtn=document.getElementById("clearSel");let selectedCountries=[],categories=[],points=[],years=[],curYear=null,allRows=[];
d3.csv(CSV_URL,d3.autoType).then(init).catch(err=>{console.error(err);document.querySelector('.wrap').insertAdjacentHTML('beforeend','<p style="text-align:center;color:#b42318">The data could not be loaded.</p>')});
function init(rows){allRows=rows.map(d=>({Year:+d.Year,Metric:String(d.Metric),Country:String(d.Country),Score:+d.Score}));years=[...new Set(allRows.map(d=>d.Year))].sort(d3.ascending);curYear=d3.max(years);[...years].sort((a,b)=>b-a).forEach(y=>yearSel.add(new Option(y,y,false,y===curYear)));yearSel.classList.add('soft');yearSel.addEventListener('change',()=>yearSel.classList.remove('soft'));const byYear=allRows.filter(d=>d.Year===curYear),metrics=[...new Set(byYear.map(d=>d.Metric))],euVal=Object.fromEntries(metrics.map(m=>{const row=byYear.find(d=>d.Metric===m&&d.Country==="European Union");return[m,row?row.Score:NaN]}));categories=metrics.slice().sort((a,b)=>d3.descending(euVal[a],euVal[b]));const rowsHeight=(categories.length-1)*rowGap,totalH=margin.top+margin.bottom+rowsHeight+142;svg.attr("height",totalH);categories.forEach((lab,i)=>{g.append("text").attr("class","label").attr("x",labelLeft).attr("y",rowY(i)).attr("text-anchor","start").text(lab);g.append("line").attr("class","row-rule").attr("x1",labelLeft).attr("x2",innerW).attr("y1",rowY(i)+r+38).attr("y2",rowY(i)+r+38)});g.append("line").attr("x1",x(5)).attr("x2",x(5)).attr("y1",0).attr("y2",rowY(categories.length-1)+r+38).attr("stroke","#d6d6d6");const cues=g.append("g").attr("class","axis-cues").attr("transform",`translate(0,${rowsHeight+78})`);cues.append("text").attr("class","low").attr("x",x(1.2)).attr("text-anchor","start").text("← Lower trust");cues.append("text").attr("class","high").attr("x",x(7.5)).attr("text-anchor","end").text("Higher trust →");points=buildPoints(byYear);beeswarm(points);drawDots();const allCountries=[...new Set(allRows.map(d=>d.Country))].filter(Boolean),ordered=["European Union",...allCountries.filter(c=>c!=="European Union").sort((a,b)=>a.localeCompare(b))];ordered.forEach(c=>countrySel.add(new Option(c,c)));yearSel.addEventListener("change",()=>{const y=+yearSel.value;if(y===curYear)return;const prevMap=new Map(points.map(p=>[`${p.Metric}|${p.Country}`,{x:p.x,y:p.y}])),prevSelected=Object.fromEntries(selectedCountries.map(c=>[c,getCountryPoints(c).map(p=>({...p}))]));curYear=y;updateYear(allRows.filter(d=>d.Year===curYear),prevMap,prevSelected)});countrySel.addEventListener("change",()=>{const choice=countrySel.value;if(!choice)return;addCountry(choice,true);countrySel.value=""});clearBtn.addEventListener("click",()=>{selectedCountries=[];updateCountryDisplay();applyFade(new Set);clearLayers()});svg.on("click",event=>{if(event.target.tagName.toLowerCase()!=="circle")deselectLast()})}
function deselectLast(){if(!selectedCountries.length)return;selectedCountries.pop();updateCountryDisplay();applyFade(new Set(selectedCountries));drawSelected(false)}function updateCountryDisplay(){if(!selectedCountries.length){countryDisplay.textContent="Select a country";clearBtn.hidden=true}else{countryDisplay.textContent=selectedCountries.join("  ·  ");clearBtn.hidden=false}}function addCountry(c,animateNew){const idx=selectedCountries.indexOf(c);if(idx>=0)selectedCountries.splice(idx,1);else{if(selectedCountries.length===2)selectedCountries.shift();selectedCountries.push(c)}updateCountryDisplay();applyFade(new Set(selectedCountries));drawSelected(animateNew)}function clearLayers(){Object.values(layers).forEach(L=>{L.g.selectAll("*").remove();L.labelG.selectAll("*").remove()});bandG.selectAll("*").remove()}
function updateYear(rows,prevMap,prevSelected){points=buildPoints(rows);beeswarm(points);drawDots(prevMap);drawSelected(false,prevSelected)}
function buildPoints(rows){return rows.map(d=>({...d,value:+d.Score,row:categories.indexOf(d.Metric),id:`${d.Year}|${d.Metric}|${d.Country}`,x:x(+d.Score),y:rowY(categories.indexOf(d.Metric))})).filter(d=>d.row>=0&&Number.isFinite(d.value))}
function beeswarm(pts){const byRow=d3.group(pts,d=>d.row);byRow.forEach(rowPts=>{rowPts.sort((a,b)=>a.x-b.x);for(let i=0;i<rowPts.length;i++){let y=rowY(rowPts[i].row),tries=0;while(tries++<200){let ok=true;for(let j=0;j<i;j++){const dx=rowPts[i].x-rowPts[j].x,dy=y-rowPts[j].y;if(dx*dx+dy*dy<(2*r+1)*(2*r+1)){ok=false;break}}if(ok)break;y=rowY(rowPts[i].row)+((tries%2?1:-1)*Math.ceil(tries/2))}rowPts[i].y=y}})}
function drawDots(prevMap){const sel=dotsG.selectAll("circle").data(points,d=>d.id);sel.exit().remove();const enter=sel.enter().append("circle").attr("class",d=>`dot ${d.Country==="European Union"?"eu-dot":""}`).attr("r",r).attr("cx",d=>prevMap?.get(`${d.Metric}|${d.Country}`)?.x??d.x).attr("cy",d=>prevMap?.get(`${d.Metric}|${d.Country}`)?.y??d.y).attr("fill",d=>color(d.value)).on("mousemove",showTip).on("mouseleave",hideTip).on("click",(event,d)=>{event.stopPropagation();addCountry(d.Country,true)});enter.merge(sel).interrupt().attr("fill",d=>color(d.value)).transition().duration(prevMap?MOVE_MS:0).ease(d3.easeCubicInOut).attr("cx",d=>d.x).attr("cy",d=>d.y);applyFade(new Set(selectedCountries))}
function getCountryPoints(country){return categories.map(m=>points.find(p=>p.Country===country&&p.Metric===m)).filter(Boolean)}
function drawSelected(animateNew,prevByCountry={}){clearLayers();if(!selectedCountries.length)return;const A=selectedCountries[0],B=selectedCountries[1],prevA=prevByCountry[A],prevB=prevByCountry[B];if(A)drawCountryLayer("A",A,animateNew,prevA);if(B)drawCountryLayer("B",B,animateNew,prevB);if(A&&B)drawBetweenBand(A,B,prevA,prevB)}
function oldPoint(prevPts,metric,fallback){return prevPts?.find(p=>p.Metric===metric)||fallback}
function drawCountryLayer(slot,country,animateNew,prevPts){const L=layers[slot],pts=getCountryPoints(country);if(!pts.length)return;const path=L.g.append("path").attr("class",`highlight ${slot==="B"?"second":""}`).attr("d",lineGen(prevPts||pts));if(prevPts){path.transition().duration(MOVE_MS).ease(d3.easeCubicInOut).attr("d",lineGen(pts))}else if(animateNew){const len=path.node().getTotalLength();path.attr("stroke-dasharray",`${len} ${len}`).attr("stroke-dashoffset",len).transition().duration(700).ease(d3.easeCubicOut).attr("stroke-dashoffset",0)}L.g.selectAll("circle").data(pts,d=>d.Metric).enter().append("circle").attr("class",`highlight-pin ${slot==="B"?"second":""}`).attr("r",r+4).attr("cx",d=>oldPoint(prevPts,d.Metric,d).x).attr("cy",d=>oldPoint(prevPts,d.Metric,d).y).transition().duration(prevPts?MOVE_MS:0).ease(d3.easeCubicInOut).attr("cx",d=>d.x).attr("cy",d=>d.y);const lp=pts[0],oldLp=oldPoint(prevPts,lp.Metric,lp),fo=L.labelG.append("foreignObject").attr("class","name-fo").attr("x",Math.min(innerW-160,oldLp.x+12)).attr("y",oldLp.y-18).attr("width",160).attr("height",34);if(prevPts)fo.transition().duration(MOVE_MS).ease(d3.easeCubicInOut).attr("x",Math.min(innerW-160,lp.x+12)).attr("y",lp.y-18);const div=fo.append("xhtml:div").attr("class","flag-row"),code=FLAG_CODE[country];if(code)div.append("span").attr("class",`fi fi-${code}`);div.append("span").text(country)}
function bandPath(A,B){const pairs=categories.map(m=>{const pa=A?.find(p=>p.Metric===m),pb=B?.find(p=>p.Metric===m);return pa&&pb?{pa,pb}:null}).filter(Boolean);if(!pairs.length)return null;const top=pairs.map(d=>({x:d.pa.x,y:d.pa.y})),bottom=pairs.slice().reverse().map(d=>({x:d.pb.x,y:d.pb.y}));return d3.line().x(d=>d.x).y(d=>d.y).curve(curve)([...top,...bottom])+"Z"}
function drawBetweenBand(a,b,prevA,prevB){const A=getCountryPoints(a),B=getCountryPoints(b),finalPath=bandPath(A,B);if(!finalPath)return;const path=bandG.append("path").attr("class","between-band").attr("d",bandPath(prevA,prevB)||finalPath);if(prevA&&prevB)path.transition().duration(MOVE_MS).ease(d3.easeCubicInOut).attr("d",finalPath)}
</script>
</body>
</html>
